name: Merge Claude routine branches

# The Claude Code Cloud Routine pushes its daily changes to a claude/*
# branch instead of main (a platform-level safety default, not something
# ROUTINE.md's prompt controls). This workflow fast-forwards main to match
# as soon as one of those branches is pushed, so Netlify's existing
# git-integration deploy still fires with no human step in between.
on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to the routine's branch
        run: |
          git config user.name "gt-tracker-bot"
          git config user.email "actions@github.com"
          git fetch origin "${{ github.ref_name }}"
          git merge --ff-only "origin/${{ github.ref_name }}"
          git push origin main

      - name: Delete merged branch
        if: success()
        run: git push origin --delete "${{ github.ref_name }}"
